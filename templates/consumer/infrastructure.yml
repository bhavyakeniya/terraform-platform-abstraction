# Generated by the platform. Teams maintain JSON, not these implementation steps.
name: Team infrastructure
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment directory to plan/apply (dev, staging, prod, or another registered name)
        type: string
        required: true
        default: dev
      mode:
        description: Plan only, or create and apply a fresh saved plan
        type: choice
        options: [check, plan, apply]
        default: plan
      localstack:
        description: Run isolated LocalStack Hobby integration; select mode=check to avoid AWS
        type: boolean
        default: false
      allow-destroy:
        description: Allow deletion/replacement in this manual apply
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
jobs:
  infrastructure:
    uses: PLATFORM_REPOSITORY/.github/workflows/team-infrastructure.yml@PLATFORM_REF
    with:
      platform-repository: PLATFORM_REPOSITORY
      platform-ref: PLATFORM_REF
      environment: ${{ inputs.environment || '' }}
      mode: ${{ inputs.mode || 'plan' }}
      allow-destroy: ${{ inputs.allow-destroy || false }}
      localstack: ${{ inputs.localstack || false }}
    secrets:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
