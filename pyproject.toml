[project]
name = "terraform-platform-abstraction"
version = "0.1.0"
description = "Terraform platform abstraction: module, generic root, and declaration pipeline"
requires-python = ">=3.13,<3.14"
dependencies = [
    "jsonschema>=4.23,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pyyaml>=6.0,<7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
